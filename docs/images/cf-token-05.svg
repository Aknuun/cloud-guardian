  <text x="1040" y="178" text-anchor="end" font-size="24" fill="#fff3e6" font-family="Tahoma, Arial, sans-serif">توکن فقط یک‌بار نشان داده می‌شود</text>
  <rect x="440" y="270" width="400" height="80" rx="10" fill="#ffffff" stroke="#F48120" stroke-width="3"/>
