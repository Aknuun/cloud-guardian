  <text x="640" y="580" text-anchor="middle" font-size="25" fill="#555555" font-family="Tahoma, Arial, sans-serif">معمولاً نصب‌کننده خودش شناسه را از توکن پیدا می‌کند و نیازی نیست</text>
  <text x="640" y="770" text-anchor="middle" font-size="20" fill="#999999" font-family="Tahoma, Arial, sans-serif">نگهبان ابری • cloud-guardian</text>
