  <circle cx="68" cy="32" r="9" fill="#f5a623"/>
  <circle cx="96" cy="32" r="9" fill="#7ed321"/>
  <rect x="130" y="14" width="1020" height="36" rx="18" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="640" y="39" text-anchor="middle" font-size="20" fill="#555555" font-family="Arial, Tahoma, sans-serif">dash.cloudflare.com — Home</text>
  <rect y="64" width="1280" height="150" fill="#F48120"/>
  <circle cx="1130" cy="139" r="52" fill="#ffffff"/>
