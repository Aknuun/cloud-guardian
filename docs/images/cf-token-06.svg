  <text x="1040" y="132" text-anchor="end" font-size="42" font-weight="bold" fill="#ffffff" font-family="Tahoma, Arial, sans-serif">مرحلهٔ ۶ — شناسهٔ حساب</text>
  <text x="1040" y="178" text-anchor="end" font-size="24" fill="#fff3e6" font-family="Tahoma, Arial, sans-serif">فقط اگر نصب‌کننده خواست</text>
  <text x="1150" y="300" text-anchor="end" font-size="30" fill="#333333" font-family="Tahoma, Arial, sans-serif">• صفحهٔ اصلی: <tspan direction="ltr">dash.cloudflare.com</tspan></text>
  <text x="1150" y="360" text-anchor="end" font-size="30" fill="#333333" font-family="Tahoma, Arial, sans-serif">• سمت راست — باکس <tspan direction="ltr">API</tspan></text>
